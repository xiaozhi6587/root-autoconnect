name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build test command-line fixture
        run: dotnet build .\Verification\FakeTool\FakeTool.csproj -c Release -f net471
      - name: Run functional verification
        run: dotnet run --project .\Verification\Verification.csproj -c Release -f net471
      - name: Build release
        shell: pwsh
        run: .\tools\Publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: root-autoconnect-net471
          path: downloads/*.zip
